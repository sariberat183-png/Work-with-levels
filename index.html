<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="google-site-verification" content="XZ3MWKkU21wlY-G0vxs47xqUeqRYV8j9ClaUMkLD5Cc" />
  <title>Work With Levels</title>
  <style>
    :root{--ink:#192a35;--muted:#60717a;--paper:#f8f7f2;--card:#fff;--blue:#176b72;--blue2:#dcefed;--gold:#e8b95d;--line:#e7e5dc;--coral:#d67859;--shadow:0 16px 45px #1d354411}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}button{font:inherit}.shell{max-width:1120px;margin:auto;padding:22px 28px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0 28px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em}.brand-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:14px;background:var(--blue);color:white;font-size:21px}.brand small{display:block;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.top-note{font-size:13px;color:var(--muted)}
    .hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;min-height:300px;padding:42px 48px;border-radius:28px;background:#e7f0e9}.hero:after{content:"";position:absolute;width:340px;height:340px;border:1px solid #176b7222;border-radius:50%;right:3%;top:-45%;box-shadow:0 0 0 35px #176b7208,0 0 0 72px #176b7207}.eyebrow{margin:0 0 12px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{max-width:630px;margin:0;font-family:Georgia,serif;font-weight:500;font-size:clamp(36px,5vw,58px);line-height:1.08;letter-spacing:-.045em}.hero p:not(.eyebrow){max-width:540px;color:#52636a;margin:17px 0 0;font-size:16px}.statue{position:relative;z-index:1;display:grid;place-items:center;min-height:210px;color:var(--blue)}.statue .halo{position:absolute;width:205px;height:205px;border:1px solid #176b7230;border-radius:50%}.statue .halo:before,.statue .halo:after{content:"";position:absolute;inset:15px;border:1px solid #176b7218;border-radius:50%}.statue .halo:after{inset:-18px}.statue .emoji{font-size:116px;filter:drop-shadow(0 12px 8px #176b7220)}.statue .tag{position:absolute;right:7%;bottom:9px;padding:9px 13px;border:1px solid #ffffffaa;border-radius:14px;background:#ffffffc9;font-size:12px;font-weight:750;box-shadow:var(--shadow)}
    .section-head{margin:18px 0 20px}.section-head h2{margin:0;font-family:Georgia,serif;font-size:29px;font-weight:500}.article-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.story-tile{position:relative;display:flex;align-items:end;width:100%;min-height:230px;padding:22px;border:0;border-radius:22px;overflow:hidden;background-color:#36535a;background-image:linear-gradient(0deg,#102128d9,transparent 74%),var(--tile-image);background-size:cover;background-position:center;color:#fff;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}.story-tile:hover{transform:translateY(-3px);box-shadow:0 20px 45px #1d354422}.story-tile span{font-family:Georgia,serif;font-size:clamp(24px,3vw,34px);line-height:1.1;text-shadow:0 2px 14px #0008}.story-tile small{position:absolute;top:16px;left:18px;padding:6px 10px;border-radius:999px;background:#ffffffdc;color:#263943;font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}#reader-view[hidden],#library-view[hidden]{display:none}#reader-view{--reader-image:none;padding:18px;border-radius:25px;background-color:#edf0ed;background-image:linear-gradient(135deg,#f8f7f2df,#f8f7f2e8),var(--reader-image);background-size:cover;background-position:center;background-attachment:local}.back-button{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-weight:750;cursor:pointer}.reader-head{position:relative;isolation:isolate;display:flex;align-items:center;gap:15px;min-height:130px;margin:14px 0 18px;padding:22px 25px;border-radius:20px;overflow:hidden;background-color:var(--accent);background-image:linear-gradient(90deg,#102128c9,#10212855),var(--reader-image);background-size:cover;background-position:center;color:#fff}.reader-head h2{margin:0;font-family:Georgia,serif;font-size:29px;font-weight:500}.reader-subtitle{margin:4px 0 0;color:#ffffffed;font-size:14px}.article-card{--accent:#176b72;--tint:#e7f0e9;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 22%,white);border-radius:23px;background:#ffffffed;box-shadow:var(--shadow);backdrop-filter:blur(5px)}.article-body{padding:20px 0}.article-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:17px}.levels{display:flex;gap:9px;padding:5px;border:1px solid var(--line);background:#f1f0e9;border-radius:14px;flex-wrap:wrap}.level{border:0;background:transparent;color:#60717a;padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:800}.level.active{color:white;background:var(--accent);box-shadow:0 3px 8px #176b7233}.article-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,.8fr);gap:17px;align-items:start}.story-panel,.words,.practice{padding:21px;border:1px solid #e9e7df;border-radius:17px;background:#fff}.story{font-family:Georgia,serif;font-size:16px;line-height:1.85;color:#33434a}.story p{margin:0 0 14px}.story p:last-child{margin-bottom:0}.side-panels{display:grid;gap:14px}.card-title{display:flex;align-items:center;gap:10px;margin:0 0 13px;font-size:15px;font-weight:800}.title-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#fbefdc}.word-list{display:grid;gap:9px}.word{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:9px;border-bottom:1px solid #f0efe9}.word:last-child{border-bottom:0;padding-bottom:0}.word b{display:block;font-size:13px}.word span{display:block;color:var(--muted);font-size:12px}.word em{flex:none;color:var(--accent);background:var(--tint);padding:4px 8px;border-radius:9px;font-style:normal;font-size:11px;font-weight:800}.practice{background:color-mix(in srgb,var(--tint) 52%,white)}.practice .card-title{margin-bottom:5px}.practice>p{margin:0 0 12px;color:var(--muted);font-size:12px}.question{padding:10px 11px;margin-top:8px;border:1px solid color-mix(in srgb,var(--accent) 15%,white);border-radius:12px;background:#fff;font-size:12px;font-weight:650}.answer{display:none;color:var(--accent);font-size:12px;margin-top:5px}.question.open .answer{display:block}.question button{display:block;width:100%;border:0;background:transparent;text-align:left;color:var(--ink);font-weight:700;padding:0;cursor:pointer}.question button:after{content:"＋";float:right;color:var(--accent)}.question.open button:after{content:"−"}.footer{display:flex;justify-content:space-between;gap:14px;margin-top:30px;padding:18px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer b{color:var(--ink)}
    @media(max-width:760px){.shell{padding:14px 16px 40px}.top{padding-bottom:17px}.top-note{display:none}.article-list{grid-template-columns:1fr;gap:13px}.story-tile{min-height:185px;padding:19px}.story-tile span{font-size:28px}.section-head{margin-top:10px}#reader-view{padding:11px}.reader-head{padding:18px;min-height:112px}.reader-head h2{font-size:24px}.article-toolbar{align-items:start;flex-direction:column}.levels{width:100%;justify-content:space-between}.level{flex:1;padding:8px 5px}.article-layout{grid-template-columns:1fr}.story-panel,.words,.practice{padding:18px}.story{font-size:16px}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="brand-mark">L</div><div>Work With Levels<small>Read · Learn · Explore</small></div></div><div class="top-note">Aynı hikâye, sana uygun seviyede.</div></header>
    <section id="library-view"><div class="section-head"><h2>Metin seç</h2></div><div class="article-list" id="article-list"></div></section>
    <section id="reader-view" hidden></section>
    <footer class="footer"><span><b>Work With Levels</b> · Kendi İngilizce okuma projen</span><span>Öğrenmek için merak et.</span></footer>
  </main>
  <script>
    const content={
      liberty:{
        title:'The Statue of Liberty',
        A1:{label:'A1 · Başlangıç',subtitle:'A famous statue in New York',paragraphs:[`The Statue of Liberty is in New York, USA. It is on an island. France gave the statue to the United States. It is a symbol of freedom.`,`A French artist made the statue. Workers built it in France. They sent it to America in many pieces. They put the pieces together in 1886.`,`The statue is very tall. It has a torch in one hand and a tablet in the other. The statue has a crown. Visitors can go up by stairs or elevator.`,`There is a museum under the statue. People can learn about its history. Visitors travel to the island by ferry. The ferry ride is not free. Children under four travel free.`],words:[['island','ada','İsim'],['artist','sanatçı','İsim'],['built','inşa etti','Fiil'],['torch','meşale','İsim'],['ferry','feribot','İsim']],questions:[['Where is the Statue of Liberty?','It is in New York, USA.'],['What does the statue hold in one hand?','It holds a torch.'],['How do visitors travel to the island?','They travel by ferry.']]},
        A2:{label:'A2 · Temel',subtitle:'A famous gift in New York Harbor',paragraphs:[`The Statue of Liberty, a symbol of freedom and democracy, stands on Liberty Island in New York Harbor. France gave it to the people of the United States as a sign of friendship.`,`The French sculptor Frédéric Auguste Bartholdi designed the statue. Workers began building it in France in 1875 and finished it in 1886. A French ship called the “Isère” carried the statue to the USA in 350 pieces. Workers spent four months putting the pieces together.`,`The statue is 93 meters tall, from the ground to the top of its torch. Visitors can climb 354 steps or take an elevator to reach the crown. The seven rays on the crown represent the seven seas and the seven continents. The statue also holds a tablet with the date July 4, 1776—the day the United States declared independence.`,`A museum inside the pedestal tells visitors about the statue’s history. People travel to the island by ferry. The statue is free to see, but visitors pay for ferry tickets. Children under four travel for free.`],words:[['freedom','özgürlük','İsim'],['harbor','liman','İsim'],['sculptor','heykeltıraş','İsim'],['construction','inşaat / yapım','İsim'],['torch','meşale','İsim'],['crown','taç','İsim'],['rays','ışınlar','İsim'],['pedestal','kaide','İsim']],questions:[['Who designed the Statue of Liberty?','The French sculptor Frédéric Auguste Bartholdi.'],['How did the statue travel to the USA?','A ship carried it in 350 pieces.'],['What do the seven rays represent?','The seven seas and seven continents.']]},
        B2:{label:'B2 · İleri',subtitle:'Engineering, symbolism, and a lasting friendship',paragraphs:[`Rising above Liberty Island at the entrance to New York Harbor, the Statue of Liberty has welcomed generations of visitors. France presented the monument to the United States as a gift of friendship. Over time, its image became closely associated with freedom, democracy, and the promise of a new beginning.`,`The French sculptor Frédéric Auguste Bartholdi designed the statue, while engineer Gustave Eiffel helped create its internal metal framework. Construction began in France in 1875. Once completed, the monument was taken apart, packed into hundreds of crates, and shipped across the Atlantic aboard the Isère. American workers reassembled the 350 sections on a granite pedestal; the completed statue was dedicated in 1886.`,`From the ground to the tip of its torch, the statue measures about 93 meters. Visitors who enter the crown climb 354 steps, although an elevator serves some parts of the monument. Its seven-pointed crown is commonly understood to represent the seven seas and seven continents. In her left hand, Lady Liberty carries a tablet inscribed with July 4, 1776, the date associated with the United States Declaration of Independence.`,`The pedestal contains a museum that explains the monument’s design, construction, and changing meaning. Today, visitors reach Liberty Island by ferry from New York or New Jersey. There is no separate charge to enter the statue grounds, but ferry tickets are required; access to the pedestal and crown may require additional planning or reservations. Millions of people visit the monument and nearby Ellis Island each year, connecting its story with immigration as well as national independence.`],words:[['framework','taşıyıcı iskelet','İsim'],['reassembled','yeniden birleştirildi','Fiil'],['dedicated','resmen açıldı / adandı','Fiil'],['inscribed','üzerine yazılmış','Sıfat/fiil'],['monument','anıt','İsim'],['associated with','ile ilişkilendirilen','İfade'],['pedestal','kaide','İsim'],['immigration','göç','İsim']],questions:[['Who helped design the statue’s internal framework?','Engineer Gustave Eiffel.'],['Why was the statue taken apart before its voyage?','It was packed into crates and shipped across the Atlantic.'],['Which additional theme is connected to nearby Ellis Island?','Immigration.']]}
      },
      bees:{
        title:'Bees and Flowers',
        A1:{label:'A1 · Başlangıç',subtitle:'How bees help plants',paragraphs:[`Bees visit flowers to find food. They collect nectar and pollen. Pollen can stick to a bee.`,`A bee can carry pollen to another flower. This helps some plants make seeds and fruit.`,`Bees are not the only pollinators. Butterflies, birds, and other animals can also carry pollen.`],words:[['bee','arı','İsim'],['flower','çiçek','İsim'],['pollen','polen','İsim'],['seed','tohum','İsim'],['carry','taşımak','Fiil']],questions:[['What do bees look for in flowers?','Food.'],['What can pollen help some plants make?','Seeds and fruit.'],['Name another pollinator.','A butterfly or a bird.']]},
        A2:{label:'A2 · Temel',subtitle:'How bees help plants',paragraphs:[`Bees fly from flower to flower to collect nectar and pollen. Some pollen sticks to their bodies as they feed.`,`A bee can carry this pollen to another flower. This movement of pollen is called pollination. Many flowering plants use pollination to make seeds, and some also grow fruit.`,`Bees are important pollinators, but other animals help too. Butterflies, moths, birds, and bats can also move pollen between flowers.`],words:[['collect','toplamak','Fiil'],['nectar','nektar','İsim'],['movement','hareket','İsim'],['pollination','tozlaşma','İsim'],['between','arasında','Edat']],questions:[['What sticks to a bee as it visits flowers?','Some pollen.'],['What is the movement of pollen called?','Pollination.'],['Do only bees move pollen?','No, other animals do too.']]},
        B2:{label:'B2 · İleri',subtitle:'Small visitors, important work',paragraphs:[`Bees visit flowers while searching for nectar and pollen. As a bee brushes against a flower, pollen grains may cling to its body and later be deposited on another flower. This transfer is known as pollination.`,`Pollination helps many plants reproduce. A plant can use pollen to form seeds, and some plants also produce fruit. Bees are important pollinators, although butterflies, moths, birds, bats, beetles, and other animals can transfer pollen as well.`,`The USDA Natural Resources Conservation Service reports that about three-fourths of flowering plants and roughly 35 percent of food crops depend on animal pollinators to reproduce. This shows why protecting habitats with food and shelter for pollinators can benefit both ecosystems and agriculture.`],words:[['brush against','temas etmek','Fiil'],['pollen grain','polen tanesi','İsim'],['cling to','yapışmak','Fiil'],['deposit','bırakmak','Fiil'],['reproduce','üremek','Fiil'],['habitat','yaşam alanı','İsim']],questions:[['What does pollination help many plants do?','Reproduce.'],['Are bees the only animals that can transfer pollen?','No. Many animals can.'],['According to USDA, about what share of flowering plants depend on animal pollinators?','About three-fourths.']]}
      }
    };
    const articleOrder=['bees','liberty'];
    const palettes={bees:{accent:'#28745d',tint:'#e3f2e8',emoji:'🐝',date:'Yeni metin',image:'https://images.unsplash.com/photo-1587049352851-8d4e89133924?auto=format&fit=crop&w=1200&q=85'},liberty:{accent:'#27729a',tint:'#e4f0f8',emoji:'🗽',date:'Önceki metin',image:'https://images.unsplash.com/photo-1518391846015-55a9cc003b25?auto=format&fit=crop&w=1200&q=85'}};
    const library=document.getElementById('library-view'),reader=document.getElementById('reader-view');
    function renderArticles(){document.getElementById('article-list').innerHTML=articleOrder.map(id=>{const topic=content[id],style=palettes[id];return `<button type="button" class="story-tile" data-open="${id}" style="--tile-image:url('${style.image}')"><small>${style.date}</small><span>${topic.title}</span></button>`}).join('')}
    function renderLevel(id,level){const item=content[id][level];reader.querySelectorAll('.level').forEach(button=>{const selected=button.dataset.level===level;button.classList.toggle('active',selected);button.setAttribute('aria-selected',selected)});reader.querySelector('[data-story]').innerHTML=item.paragraphs.map(p=>`<p>${p}</p>`).join('');reader.querySelector('[data-words]').innerHTML=item.words.map(w=>`<div class="word"><div><b>${w[0]}</b><span>${w[1]}</span></div><em>${w[2]}</em></div>`).join('');reader.querySelector('[data-questions]').innerHTML=item.questions.map((q,i)=>`<div class="question"><button type="button" aria-expanded="false">${i+1}. ${q[0]}</button><div class="answer">${q[1]}</div></div>`).join('')}
    function openArticle(id){const topic=content[id],style=palettes[id];reader.dataset.article=id;reader.style.setProperty('--accent',style.accent);reader.style.setProperty('--tint',style.tint);reader.style.setProperty('--reader-image',`url("${style.image}")`);reader.innerHTML=`<button type="button" class="back-button" data-back>← Geri · Metinler</button><header class="reader-head"><span style="font-size:38px" aria-hidden="true">${style.emoji}</span><div><h2>${topic.title}</h2><p class="reader-subtitle">${topic.A2.subtitle}</p></div></header><article class="article-card" style="--accent:${style.accent};--tint:${style.tint}"><div class="article-body"><div class="article-toolbar"><strong style="color:var(--accent)">Okuma seviyeni seç</strong><div class="levels" role="tablist" aria-label="${topic.title} İngilizce seviyesi">${['A1','A2','B2'].map(level=>`<button class="level ${level==='A2'?'active':''}" data-level="${level}" role="tab" aria-selected="${level==='A2'}">${level} · ${level==='A1'?'Başlangıç':level==='A2'?'Temel':'İleri'}</button>`).join('')}</div></div><div class="article-layout"><section class="story-panel"><div class="story" data-story></div></section><aside class="side-panels"><section class="words"><h3 class="card-title"><span class="title-icon">✦</span>Hedef kelimeler</h3><div class="word-list" data-words></div></section><section class="practice"><h3 class="card-title"><span class="title-icon">☼</span>Okuduğunu anla</h3><p>Sorulara dokunarak cevapları kontrol et.</p><div data-questions></div></section></aside></div></div></article>`;library.hidden=true;reader.hidden=false;renderLevel(id,'A2');window.scrollTo({top:0,behavior:'smooth'})}
    renderArticles();
    document.getElementById('article-list').addEventListener('click',event=>{const tile=event.target.closest('[data-open]');if(tile)openArticle(tile.dataset.open)});
    reader.addEventListener('click',event=>{if(event.target.closest('[data-back]')){reader.hidden=true;library.hidden=false;window.scrollTo({top:0,behavior:'smooth'});return}const levelButton=event.target.closest('.level');if(levelButton){renderLevel(reader.dataset.article,levelButton.dataset.level);return}const questionButton=event.target.closest('.question button');if(questionButton){const box=questionButton.parentElement;box.classList.toggle('open');questionButton.setAttribute('aria-expanded',box.classList.contains('open'))}});
  </script>
</body>
</html>
